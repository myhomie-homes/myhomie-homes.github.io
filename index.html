<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyHomie - A home is built with love and dreams</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L170B45TET"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-L170B45TET');

    <script>
        window.TallyConfig = {
          "formId": "wAyeJz",
          "popup": {
            "emoji": {
              "text": "👋",
              "animation": "wave"
            }
          }
        };
    </script>
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #063b40;
            color: white;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* Navigation */
        nav {
            background-color: #063b40;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: white;
        }

        .logo img {
            height: 2rem;
            width: auto;
        }

        .logo span {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: #50E5B4;
            background-color: rgba(80, 229, 180, 0.1);
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 2rem 0;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: center;
        }

        .hero-text {
            text-align: left;
        }

        .hero-text h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-text .subtitle {
            color: #50E5B4;
            font-size: 1.25rem;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .phone-card {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }

        .phone-icon {
            color: #50E5B4;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .phone-info h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .phone-info a {
            color: #50E5B4;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
            display: block;
            margin-bottom: 0.25rem;
        }

        .phone-info a:hover {
            color: #3bc598;
        }

        .phone-info .phone-subtitle {
            color: #9ca3af;
            font-size: 0.875rem;
        }

        .hero-image {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-image img {
            max-width: 100%;
            height: auto;
            max-height: 600px;
        }

        /* Footer */
        footer {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 2rem 0;
            margin-top: auto;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-links {
            display: flex;
            gap: 2rem;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #50E5B4;
        }

        .footer-copyright {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.875rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero-content {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .hero-text {
                text-align: center;
            }

            .phone-card {
                margin: 0 auto;
            }

            .nav-content {
                flex-direction: column;
                gap: 1rem;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
            }

            .footer-links {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 0.5rem;
            }

            .nav-links {
                flex-direction: column;
                gap: 0.5rem;
            }

            .footer-links {
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        /* Phone Icon */
        .phone-icon::before {
            content: "📞";
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="container">
            <div class="nav-content">
                <a href="index.html" class="logo">
                    <img src="assets/images/2503_MyHomie_logo_white.png" alt="MyHomie Logo">
                    <span>MyHomie</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="container">
            <div class="hero-content">
                <div class="hero-text">
                    <h1>A home is built with love and dreams</h1>
                    <p class="subtitle">Let's find home together, MyHomie!</p>
                    
                    <div class="phone-card">
                        <div class="phone-icon"></div>
                        <div class="phone-info">
                            <h3>Call your AI Homie 24/7</h3>
                            <a href="tel:+17799946643">+1 (779) 99-HOMIE</a>
                            <p class="phone-subtitle">(+1 779-994-6643)</p>
                        </div>
                    </div>
                </div>
                
                <div class="hero-image">
                    <img src="assets/images/homepage3.png" alt="Modern home">
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-links">
                    <a href="terms.html">Terms and Conditions</a>
                    <a href="privacy.html">Privacy Policy</a>
                </div>
                <div class="footer-copyright">
                    © 2025 MyHomie. All rights reserved.
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
